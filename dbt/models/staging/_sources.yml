version: 2

sources:
  - name: staging_raw
    database: mobile_coverage
    schema: staging
    tables:
      - name: raw_signal_strength_by_operator
        columns:
          - name: process_date
            tests: [not_null]
      - name: raw_gps_precision_by_provider
        columns:
          - name: process_date
            tests: [not_null]
      - name: raw_status_count
        columns:
          - name: process_date
            tests: [not_null]
      - name: ext_streaming_status_count
        description: >
          Glue streaming status_count output, read in place from
          s3://roy-projects/mobile-network-lab/aggregations/status_count/ (external table).
      - name: ext_streaming_signal_strength_by_operator
        description: >
          Glue streaming signal_strength_by_operator output, read in place from
          s3://roy-projects/mobile-network-lab/aggregations/signal_strength_by_operator/